
[project]
name = "portello"
version = "1.0.0"
description = "Portello is a desktop authentication system built with Python and Tkinter."
requires-python = ">=3.11"
dependencies = [
    "pymongo==4.10.1",
    "werkzeug==3.1.6",
    "pydantic==2.11.9",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pre-commit==4.3.0",
    "pip-audit==2.7.3",
    "ruff==0.11.12",
]
test = [
    "pytest==8.4.2",
    "pytest-env==1.1.5",
    "pytest-cov==4.1.0",
    "pytest-timeout==2.3.1",
    "pytest-xdist==3.5.0",
]
build = [
    "pyinstaller==6.16.0",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
log_cli = true
log_cli_level = "WARNING"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::pytest.PytestCollectionWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
env = [
    "TEST_MONGO_HOST=localhost",
    "TEST_MONGO_PORT=27018",
    "TEST_MONGO_USER=admin",
    "TEST_MONGO_PASS=secret123",
    "TEST_MONGO_DB=test_db",
    "D:MONGO_URI=mongodb://admin:secret123@localhost:27018/test_db?authSource=admin",
    "MONGO_DB_NAME=test_db",
    "MONGO_HOST=localhost",
    "MONGO_PORT=27018",
]

[tool.ruff]
line-length = 100
exclude = [".git", "__pycache__", "env", "venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E203"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
